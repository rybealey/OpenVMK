# Deploys VMK Today to the VM on every push to main (or by hand: Actions >
# Deploy > Run workflow).
#
# GitHub's runner builds the release (tools/release/make-release.mjs), rsyncs it
# to /srv/vmkt/app on the VM as the `deploy` user, restarts the game and waits
# for /health. After the first deploy only changed files travel. The VM's own
# data/ (the database), logs/ and .env (its settings) are never sent, changed
# or deleted.
#
# Needs one repository secret, VMKT_DEPLOY_KEY: the private half of the deploy
# key whose public half is in /home/deploy/.ssh/authorized_keys on the VM.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a second push waits for the first instead of racing it.
concurrency:
  group: deploy-vm
  cancel-in-progress: false

env:
  DEPLOY_HOST: 45.32.205.161
  DEPLOY_USER: deploy
  DEPLOY_PATH: /srv/vmkt/app
  # The VM's ED25519 host key, pinned so the runner never trusts an impostor
  # (SHA256:YVSDCUyHmbFx9Lv3JczID09/cFvdrkgvkZmg5mCK3lc).
  DEPLOY_HOST_KEY: 45.32.205.161 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIF39z46JUl4jBPrx5kawvd6h+LKTUZAV8OdytX5OGf5H

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build the release
        run: node tools/release/make-release.mjs --out "$RUNNER_TEMP/vmkt-release" --force --no-node

      - name: Set up SSH
        env:
          DEPLOY_KEY: ${{ secrets.VMKT_DEPLOY_KEY }}
        run: |
          test -n "$DEPLOY_KEY" || { echo "::error::The VMKT_DEPLOY_KEY secret is not set."; exit 1; }
          install -d -m 700 ~/.ssh
          echo "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Upload the release
        run: |
          rsync -az --delete --stats \
            --exclude=/data/ --exclude=/logs/ --exclude=/.env \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes" \
            "$RUNNER_TEMP/vmkt-release/" "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Restart the game
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<EOF
          set -e
          cd "$DEPLOY_PATH"
          docker compose up -d --remove-orphans
          docker compose restart vmk
          for i in \$(seq 1 45); do
            if curl -fsS http://127.0.0.1:5199/health >/dev/null 2>&1; then echo "VMK Today is up."; exit 0; fi
            sleep 2
          done
          echo "The game did not come up within 90 seconds:"
          docker compose logs --tail 60 vmk
          exit 1
          EOF

      - name: Forget the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
